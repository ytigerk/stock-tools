# 매일 아침 데이터를 새로 받아 사이트를 다시 만들고 GitHub Pages에 올리는 자동 작업
name: 사이트 갱신

on:
  schedule:
    # 한국 시간 화~토 오전 7:07 (= UTC 월~금 22:07). 미국 월~금 장 마감 후.
    # GitHub 서버가 붐비면 몇 분~수십 분 늦게 실행될 수 있음.
    - cron: "7 22 * * 1-5"
  workflow_dispatch:      # Actions 탭에서 "Run workflow" 버튼으로 직접 실행
  push:
    branches: [main]      # 코드를 고쳐서 올리면 바로 다시 만들기

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 데이터 받기 + 매물 출회일 계산 + 페이지 만들기
        run: |
          mkdir -p site
          cp home/index.html site/index.html
          python distribution/update_data.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
