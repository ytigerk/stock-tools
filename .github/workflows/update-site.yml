# 매일 아침 데이터를 새로 받아 사이트를 다시 만들고 GitHub Pages에 올리는 자동 작업
name: 사이트 갱신

on:
  schedule:
    # 한국 시간 화~토 오전 7:07 (= UTC 월~금 22:07). 미국 월~금 장 마감 후.
    # GitHub 서버가 붐비면 몇 분~수십 분 늦게 실행될 수 있음.
    - cron: "7 22 * * 1-5"
  workflow_dispatch:      # Actions 탭에서 "Run workflow" 버튼으로 직접 실행
  push:
    branches: [main]      # 코드를 고쳐서 올리면 바로 다시 만들기

permissions:
  contents: write   # 매물 출회일 기록(history.csv)을 저장소에 저장하기 위해
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 첫 화면 + 매물 출회일 체커
        run: |
          python home/build_home.py
          python distribution/update_data.py
      - name: 주식 스크리너 (전 종목 주가 + SEC 실적, 약 10분)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python screener/build_screener.py
          python screener/render_page.py
      - name: 매물 출회일 기록 저장 (매일 한 줄씩 쌓임)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/history.csv
          git diff --cached --quiet || (git commit -m "매물 출회일 기록 $(date -u +%F)" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
