<title>매물 출회일 체커</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
/* Layout: 한 열짜리 도구 화면. 요약(지수별 개수) → 월~금 캘린더 → 선택한 날의 상세 */
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --ink: #161a22;
  --muted: #5d6573;
  --line: #dde1e8;
  --window: #e9eef8;
  --accent: #2c5bd6;
  --dist: #d2342b;
  --dist-soft: #fbe6e4;
  --ok: #1f8a4c;
  --warn: #b26a00;
  --warn-soft: #fbf0dc;
  --ok-soft: #e2f3e9;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --surface: #1a1e26; --ink: #e8ebf0; --muted: #9aa3b2; --line: #2b313c;
    --window: #1f2838; --accent: #7aa2ff; --dist: #ff6b5f; --dist-soft: #3a1f1e;
    --ok: #5fd08f; --warn: #f0b350; --warn-soft: #3a2e17; --ok-soft: #173024; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1e26; --ink: #e8ebf0; --muted: #9aa3b2; --line: #2b313c;
  --window: #1f2838; --accent: #7aa2ff; --dist: #ff6b5f; --dist-soft: #3a1f1e;
  --ok: #5fd08f; --warn: #f0b350; --warn-soft: #3a2e17; --ok-soft: #173024; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); line-height: 1.5; }
/* PC 작업 화면: 메뉴 | 왼쪽(요약, 캘린더, 상세) | 오른쪽 지수 일봉 차트 3개 */
.shell { height: 100%; display: grid; grid-template-columns: 160px minmax(0, 1fr) 50%; padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.shell > * { min-height: 0; }
.main { min-width: 0; overflow-y: auto; border-right: 1px solid var(--line); }
.wrap { display: grid; gap: 10px; padding: 14px 16px 16px; }
.charts { display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); min-width: 0; background: var(--surface); }
.ch { display: flex; flex-direction: column; min-height: 0; border-bottom: 1px solid var(--line); }
.ch:last-child { border-bottom: 0; }
.ch-head { display: flex; align-items: baseline; gap: 10px; padding: 8px 16px; flex-wrap: wrap; }
.ch-head h3 { margin: 0; font-size: 0.9rem; white-space: nowrap; }
.ch-head .cnt { font-size: 0.75rem; color: var(--muted); }
.ch-legend { margin-left: auto; font-family: var(--font-num); font-size: 0.74rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.ch-legend .d { color: var(--dist); font-weight: 700; }
.ch-body { flex: 1; min-height: 0; position: relative; }
.ch-body > div { position: absolute; inset: 0; }
.ch-msg { display: grid; place-items: center; color: var(--muted); font-size: 0.85rem; }
@media (max-width: 1000px) {
  html, body { height: auto; }
  .shell { grid-template-columns: 1fr; height: auto; }
  .shell > .sidenav { height: auto; }
  .charts { grid-template-rows: repeat(3, 300px); }
}
header { display: grid; gap: 4px; }
.top { display: flex; flex-wrap: nowrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; }
.top header { min-width: 0; }
.tally { display: grid; gap: 10px; }
.tally-head { display: grid; justify-items: end; gap: 3px; margin-left: auto; }
.tally-label { font-size: 0.72rem; color: var(--muted); font-weight: 600; letter-spacing: 0.02em; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--surface); gap: 2px; }
.seg button {
  font: inherit; font-size: 0.8rem; border: 0; background: transparent; color: var(--muted);
  padding: 4px 10px; border-radius: 6px; cursor: pointer; line-height: 1.3; white-space: nowrap;
}
.seg button small { font-size: 0.7rem; margin-left: 4px; opacity: 0.85; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1 { margin: 0; font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.meta { color: var(--muted); font-size: 0.8rem; }
.rule {
  font-size: 0.8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 14px;
}
.rule b { color: var(--ink); font-weight: 600; }
.lag { font-size: 0.8rem; color: var(--warn); background: var(--warn-soft); border-radius: 7px; padding: 5px 10px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* 요약 */
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.idx {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 6px 12px; display: grid; grid-template-columns: auto auto 1fr; align-items: baseline; gap: 0 8px; min-width: 0;
}
.idx .pill { justify-self: end; }
.idx-name { font-size: 0.8rem; color: var(--muted); font-weight: 600; letter-spacing: 0.02em; }
.idx-count { font-family: var(--font-num); font-size: 1.35rem; font-weight: 600; line-height: 1.15; }
.idx-count small { font-size: 0.85rem; color: var(--muted); font-weight: 400; margin-left: 2px; }
.pill {
  justify-self: start; font-size: 0.7rem; font-weight: 600; padding: 1px 7px; border-radius: 99px;
}
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--dist-soft); color: var(--dist); }
.summary-note { font-size: 0.74rem; color: var(--muted); }

/* 캘린더 */
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-title { font-weight: 700; font-size: 0.98rem; }
.cal-head .legend { margin-right: auto; margin-left: 14px; }
.nav { display: flex; gap: 6px; }
.nav button {
  font: inherit; font-size: 0.8rem; background: var(--bg); color: var(--ink); border: 1px solid var(--line);
  border-radius: 7px; padding: 2px 10px; cursor: pointer;
}
.nav button:disabled { opacity: 0.35; cursor: default; }
.nav button:focus-visible, .day:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.78rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.sw.win { background: var(--window); border: 1px solid var(--line); }
.sw.d { background: var(--dist); }
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.dow { font-size: 0.75rem; color: var(--muted); text-align: center; font-weight: 600; }
.day {
  font: inherit; min-height: 0; text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 7px; padding: 3px 5px; display: grid; align-content: space-between; gap: 2px;
  cursor: pointer; min-width: 0;
}
.day.inwin { background: var(--window); }
.day.empty { visibility: hidden; }
.day.closed, .day.future { cursor: default; color: var(--muted); background: transparent; border-style: dashed; }
.day.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.dnum { font-family: var(--font-num); font-size: 0.78rem; font-weight: 500; line-height: 1.2; }
.tag { font-size: 0.68rem; color: var(--muted); }
.marks { display: flex; flex-wrap: wrap; gap: 2px; }
.mk {
  font-size: 0.66rem; font-weight: 500; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding: 1px 4px; border-radius: 4px; color: var(--muted); opacity: 0.6;
}
.mk.on { background: var(--dist); color: #fff; font-weight: 700; opacity: 1; }

/* 상세 */
.detail { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; display: grid; gap: 2px; }
.detail h2 { margin: 0; font-size: 0.9rem; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
tbody tr:last-child td { border-bottom: 0; }
th, td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th:last-child, td:last-child { text-align: center; }
th { font-size: 0.75rem; color: var(--muted); font-weight: 600; }
td.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.dn { color: var(--dist); }
.up { color: var(--ok); }
.verdict { font-family: var(--font-num); font-weight: 700; font-size: 0.95rem; }
.verdict.yes { color: var(--dist); }
.verdict.no { color: var(--muted); font-weight: 400; }
footer { font-size: 0.72rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; }
@media (max-width: 520px) {
  .summary { gap: 8px; }
  .idx { padding: 8px 10px; }
  .idx-count { font-size: 1.4rem; }
  .day { min-height: 74px; padding: 4px; }
  .mk { font-size: 0.6rem; padding: 1px 3px; }
}
@media (prefers-reduced-motion: no-preference) { .day { transition: border-color .15s; } }
</style>

<div class="shell">
<!--__NAV__-->
<div class="main">
<div class="wrap">
  <section class="tally">
    <div class="top">
      <header>
        <h1>매물 출회일 체커</h1>
        <div class="meta" id="meta"></div>
        <div class="lag" id="lag" hidden></div>
        <div class="rule" id="rule"></div>
      </header>
      <div class="tally-head">
        <span class="tally-label">집계 기간</span>
        <div class="seg" role="group" aria-label="집계 기간">
          <button type="button" id="w5" data-w="5">5주<small>25일</small></button>
          <button type="button" id="w6" data-w="6">6주<small>30일</small></button>
        </div>
      </div>
    </div>
    <div class="summary" id="summary" aria-label="지수별 최근 매물 출회일 개수"></div>
    <div class="summary-note" id="summaryNote"></div>
  </section>

  <section class="cal" aria-label="매물 출회일 캘린더">
    <div class="cal-head">
      <div class="cal-title" id="calTitle"></div>
      <div class="legend">
        <span><i class="sw d"></i>빨간 칸 = 매물 출회일</span>
        <span><i class="sw win"></i>최근 <b id="legendN">25</b>거래일</span>
      </div>
      <div class="nav">
        <button id="prev" type="button" aria-label="이전 달">◀</button>
        <button id="next" type="button" aria-label="다음 달">▶</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="detail" aria-live="polite">
    <h2 id="detailTitle"></h2>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>지수</th><th>종가</th><th>변동폭</th><th>거래량</th><th>전일 대비</th><th>매물 출회일 여부</th></tr></thead>
        <tbody id="detailBody"></tbody>
      </table>
    </div>
  </section>

  <footer id="foot"></footer>
</div>
</div>
<section class="charts" id="charts" aria-label="지수 일봉 차트"></section>
</div>

<script>
const DATA = /*__DATA__*/null;
const CHART_NOTE = "▼ 매물 출회일 · 옅은 파란 구간 = 최근 집계 기간";
const SHORT = { nasdaq: "NASDAQ", sp500: "S&amp;P 500", nyse: "NYSE" };
const DOW = ["월", "화", "수", "목", "금"];

const byDate = {};
for (const ix of DATA.indices) for (const r of ix.rows) (byDate[r.date] ||= {})[ix.key] = r;
const tradingDays = Object.keys(byDate).sort();
let weeks = 5;
try { const w = Number(localStorage.getItem("weeks")); if (w === 5 || w === 6) weeks = w; } catch (e) {}
let winStart = "";
const months = [...new Set(tradingDays.map(d => d.slice(0, 7)))];
let mi = months.length - 1;
let selected = DATA.lastDate;

const fmtPct = v => (v > 0 ? "+" : "") + v.toFixed(2) + "%";
const fmtVol = v => (v / 1e8).toFixed(1) + "억";
const iso = d => d.toISOString().slice(0, 10);

function level(n) {
  if (n >= 5) return ["bad", "경계"];
  if (n >= 3) return ["warn", "주의"];
  return ["ok", "양호"];
}

function renderHeader() {
  const gen = new Date(DATA.generatedAt);
  const kst = gen.toLocaleString("ko-KR", { timeZone: "Asia/Seoul", dateStyle: "medium", timeStyle: "short" });
  document.getElementById("meta").innerHTML =
    `기준일 <b class="num">${DATA.lastDate}</b> (미국 장 마감) · 갱신 ${kst}`;
  const late = DATA.indices.filter(ix => ix.lastDate && ix.lastDate < DATA.lastDate);
  const lag = document.getElementById("lag");
  if (late.length) {
    lag.textContent = `${late.map(ix => ix.name).join(", ")}: ${DATA.lastDate} 데이터가 아직 올라오지 않았어요 ` +
      `(마지막 ${late.map(ix => ix.lastDate).join(", ")}). 이 지수의 개수와 캘린더는 그 전날까지 기준이에요. 오전 11시쯤 다시 갱신돼요.`;
    lag.hidden = false;
  }
  const sc = DATA.sp500Check;
  document.getElementById("foot").innerHTML = DATA.indices
    .map(ix => `<div>${ix.name} 거래량: ${ix.volBasis}</div>`).join("") +
    `<div>S&amp;P 500 구성종목 ${sc.constituents}개 중 수집 실패 ${sc.failed.length}개</div>` +
    `<div>데이터: Yahoo Finance</div>`;
}

function renderSummary() {
  const n = weeks * 5;
  winStart = tradingDays[Math.max(0, tradingDays.length - n)];
  document.getElementById("rule").innerHTML =
    `<span>판단 기준: 전일 종가 대비 <b>${DATA.rule.threshold}% 이하</b> 하락 + <b>거래량 증가</b></span>` +
    `<span>개수: 최근 <b>${n}거래일</b> 안</span>`;
  document.getElementById("legendN").textContent = n;
  document.getElementById("summary").innerHTML = DATA.indices.map(ix => {
    const count = ix.rows.filter(r => r.date >= winStart && r.dist).length;
    const [cls, label] = level(count);
    return `<div class="idx"><div class="idx-name">${ix.name}</div>
      <div class="idx-count">${count}<small>개</small></div>
      <span class="pill ${cls}">${label}</span></div>`;
  }).join("");
  document.getElementById("summaryNote").textContent =
    `${winStart} ~ ${DATA.lastDate} 기준 (${weeks}주). 색 표시는 참고용(0~2 양호, 3~4 주의, 5 이상 경계).`;
  for (const b of document.querySelectorAll(".seg button"))
    b.setAttribute("aria-pressed", String(Number(b.dataset.w) === weeks));
}

function renderCalendar() {
  const ym = months[mi];
  const [y, m] = ym.split("-").map(Number);
  document.getElementById("calTitle").textContent = `${y}년 ${m}월`;
  document.getElementById("prev").disabled = mi === 0;
  document.getElementById("next").disabled = mi === months.length - 1;

  const cells = DOW.map(d => `<div class="dow">${d}</div>`);
  const first = new Date(Date.UTC(y, m - 1, 1));
  const lead = (first.getUTCDay() + 6) % 7; // 월=0
  if (lead < 5) for (let i = 0; i < lead; i++) cells.push(`<div class="day empty"></div>`);
  const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  for (let d = 1; d <= last; d++) {
    const dt = new Date(Date.UTC(y, m - 1, d));
    const wd = dt.getUTCDay();
    if (wd === 0 || wd === 6) continue;
    const key = iso(dt);
    const rec = byDate[key];
    if (!rec) {
      const future = key > DATA.lastDate;
      cells.push(`<div class="day ${future ? "future" : "closed"}"><span class="dnum">${d}</span>
        <span class="tag">${future ? "" : "휴장"}</span></div>`);
      continue;
    }
    const marks = DATA.indices.map(ix => {
      const r = rec[ix.key];
      return `<span class="mk ${r && r.dist ? "on" : ""}" title="${ix.name}">${SHORT[ix.key]}</span>`;
    }).join("");
    const inwin = key >= winStart ? "inwin" : "";
    const sel = key === selected ? "sel" : "";
    cells.push(`<button type="button" class="day ${inwin} ${sel}" data-d="${key}" aria-label="${key}">
      <span class="dnum">${d}</span><span class="marks">${marks}</span></button>`);
  }
  const grid = document.getElementById("grid");
  grid.innerHTML = cells.join("");
  grid.querySelectorAll("button.day").forEach(b => b.addEventListener("click", () => {
    selected = b.dataset.d; renderCalendar(); renderDetail(); focusCharts(selected);
  }));
}

function renderDetail() {
  const rec = byDate[selected] || {};
  const d = new Date(selected + "T00:00:00Z");
  document.getElementById("detailTitle").textContent =
    `${selected} (${DOW[(d.getUTCDay() + 6) % 7]}) 상세`;
  document.getElementById("detailBody").innerHTML = DATA.indices.map(ix => {
    const r = rec[ix.key];
    if (!r) return `<tr><td>${ix.name}</td><td colspan="5">데이터 없음</td></tr>`;
    return `<tr><td>${ix.name}</td>
      <td class="num">${r.close.toLocaleString("en-US", { minimumFractionDigits: 2 })}</td>
      <td class="num ${r.chg < 0 ? "dn" : "up"}">${fmtPct(r.chg)}</td>
      <td class="num">${fmtVol(r.vol)}</td>
      <td class="num ${r.volChg > 0 ? "up" : "dn"}">${fmtPct(r.volChg)}</td>
      <td><span class="verdict ${r.dist ? "yes" : "no"}">${r.dist ? "O" : "X"}</span></td></tr>`;
  }).join("");
}

document.getElementById("prev").addEventListener("click", () => { if (mi > 0) { mi--; renderCalendar(); } });
document.getElementById("next").addEventListener("click", () => { if (mi < months.length - 1) { mi++; renderCalendar(); } });
for (const b of document.querySelectorAll(".seg button")) b.addEventListener("click", () => {
  weeks = Number(b.dataset.w);
  try { localStorage.setItem("weeks", String(weeks)); } catch (e) {}
  renderSummary(); renderCalendar(); paintWindow();
});

/* ---------- 오른쪽: 지수 일봉 차트 3개 (TradingView Lightweight Charts) ---------- */
const CH = {};          // 지수 키 → { chart, candle, vol, win, rows, byDate }
let syncing = false;
function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function theme() {
  return {
    layout: { background: { type: "solid", color: css("--surface") }, textColor: css("--muted"),
              fontFamily: css("--font-num"), attributionLogo: true },
    grid: { vertLines: { color: css("--window") }, horzLines: { color: css("--window") } },
    rightPriceScale: { borderColor: css("--line"), minimumWidth: 84 },  // 세 차트의 날짜 위치가 위아래로 맞도록 가격 눈금 폭 고정
    timeScale: { borderColor: css("--line"), rightOffset: 2 },
  };
}

function buildCharts() {
  const box = document.getElementById("charts");
  if (!window.LightweightCharts) { box.innerHTML = `<div class="ch-msg">차트 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</div>`; return; }
  box.innerHTML = DATA.indices.map(ix => `<div class="ch"><div class="ch-head"><h3>${ix.name}</h3>
    <span class="cnt" id="cnt-${ix.key}"></span><span class="ch-legend" id="lg-${ix.key}"></span></div>
    <div class="ch-body"><div id="c-${ix.key}"></div></div></div>`).join("");
  for (const ix of DATA.indices) {
    const el = document.getElementById("c-" + ix.key);
    const chart = LightweightCharts.createChart(el, { autoSize: true, ...theme(),
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal } });
    // 집계 기간 칠하기: 꼭대기(1)부터 바닥까지 채우는 영역을 맨 먼저 깔아서 캔들 뒤에 오게
    const win = chart.addAreaSeries({ priceScaleId: "win", lineVisible: false, lineWidth: 1, lineColor: "rgba(0,0,0,0)",
      topColor: css("--window"), bottomColor: css("--window"), priceLineVisible: false, lastValueVisible: false,
      crosshairMarkerVisible: false, autoscaleInfoProvider: () => ({ priceRange: { minValue: 0, maxValue: 1 } }) });
    chart.priceScale("win").applyOptions({ scaleMargins: { top: 0, bottom: 0 }, visible: false });
    const candle = chart.addCandlestickSeries({ upColor: css("--ok"), downColor: css("--dist"), borderVisible: false,
      wickUpColor: css("--ok"), wickDownColor: css("--dist") });
    candle.priceScale().applyOptions({ scaleMargins: { top: 0.1, bottom: 0.25 } });
    const vol = chart.addHistogramSeries({ priceFormat: { type: "volume" }, priceScaleId: "vol", lastValueVisible: false, priceLineVisible: false });
    chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
    const byDate = Object.fromEntries(ix.rows.map(r => [r.date, r]));
    CH[ix.key] = { chart, candle, vol, win, rows: ix.rows, byDate, name: ix.name };
    setChartData(ix.key);
    chart.subscribeCrosshairMove(p => onHover(ix.key, p));
    chart.subscribeClick(p => { if (p && p.time) pickDate(p.time); });
    chart.timeScale().subscribeVisibleTimeRangeChange(r => syncRange(ix.key, r));
  }
  paintWindow();
  for (const k in CH) CH[k].chart.timeScale().fitContent();
  for (const k in CH) legend(k, selected);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    for (const k in CH) {
      CH[k].chart.applyOptions(theme());
      CH[k].candle.applyOptions({ upColor: css("--ok"), downColor: css("--dist"), wickUpColor: css("--ok"), wickDownColor: css("--dist") });
      CH[k].win.applyOptions({ topColor: css("--window"), bottomColor: css("--window") });
      setChartData(k);
    }
    paintWindow();
  });
}

function setChartData(k) {
  const c = CH[k], up = css("--ok"), down = css("--dist");
  c.candle.setData(c.rows.map(r => ({ time: r.date, open: r.open, high: r.high, low: r.low, close: r.close })));
  c.vol.setData(c.rows.map(r => ({ time: r.date, value: r.vol, color: (r.close >= r.open ? up : down) + "66" })));
  c.candle.setMarkers(c.rows.filter(r => r.dist).map(r => ({ time: r.date, position: "aboveBar", color: css("--ink"), shape: "arrowDown", size: 1 })));
}

function paintWindow() {
  for (const k in CH) {
    const c = CH[k];
    c.win.setData(c.rows.filter(r => r.date >= winStart).map(r => ({ time: r.date, value: 1 })));
    const n = c.rows.filter(r => r.date >= winStart && r.dist).length;
    document.getElementById("cnt-" + k).textContent = `최근 ${weeks * 5}거래일 매물 출회일 ${n}개` + (k === DATA.indices[0].key ? ` · ${CHART_NOTE}` : "");
  }
}

/* 세 차트의 가로축(기간)을 함께 움직이기 */
function syncRange(from, range) {
  if (syncing || !range) return;
  syncing = true;
  for (const k in CH) if (k !== from) CH[k].chart.timeScale().setVisibleRange(range);
  syncing = false;
}

/* 한 차트에 마우스를 올리면 나머지 차트에도 같은 날짜 십자선 */
function onHover(from, p) {
  if (syncing) return;
  syncing = true;
  const t = p && p.time;
  for (const k in CH) {
    if (k !== from) {
      const r = t && CH[k].byDate[t];
      if (r) CH[k].chart.setCrosshairPosition(r.close, t, CH[k].candle); else CH[k].chart.clearCrosshairPosition();
    }
    legend(k, t || selected);
  }
  syncing = false;
}

function legend(k, date) {
  const r = CH[k].byDate[date];
  const el = document.getElementById("lg-" + k);
  if (!r) { el.innerHTML = ""; return; }
  el.innerHTML = `<span>${r.date}</span><span>종가 ${r.close.toLocaleString("en-US", { minimumFractionDigits: 2 })}</span>` +
    `<span class="${r.chg < 0 ? "dn" : "up"}">${fmtPct(r.chg)}</span><span>거래량 ${fmtPct(r.volChg)}</span>` +
    (r.dist ? `<span class="d">▼ 매물 출회일</span>` : "");
}

/* 차트에서 날짜를 누르면 캘린더와 상세가 그 날짜로 */
function pickDate(t) {
  if (!byDate[t]) return;
  selected = t;
  const idx = months.indexOf(t.slice(0, 7));
  if (idx >= 0) mi = idx;
  renderCalendar(); renderDetail();
  for (const k in CH) legend(k, t);
}

/* 캘린더에서 날짜를 누르면 세 차트가 그 날짜를 가리키고, 화면 밖이면 그쪽으로 이동 */
function focusCharts(t) {
  for (const k in CH) {
    const c = CH[k], r = c.byDate[t];
    legend(k, t);
    if (!r) continue;
    const vr = c.chart.timeScale().getVisibleRange();
    if (vr && (t < vr.from || t > vr.to)) {
      const i = c.rows.findIndex(x => x.date === t), half = Math.max(10, Math.round((c.rows.findIndex(x => x.date >= vr.to) - c.rows.findIndex(x => x.date >= vr.from)) / 2));
      const a = c.rows[Math.max(0, i - half)], b = c.rows[Math.min(c.rows.length - 1, i + half)];
      syncing = true; c.chart.timeScale().setVisibleRange({ from: a.date, to: b.date }); syncing = false;
    }
    c.chart.setCrosshairPosition(r.close, t, c.candle);
  }
}

renderHeader(); renderSummary(); renderCalendar(); renderDetail(); buildCharts();
</script>
