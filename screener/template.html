<title>주식 스크리너</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: PC 작업 화면. 메뉴 | 조건(세로) | 종목 목록(탭) | 오른쪽 위 주봉 차트, 아래 재무 확인. 각 칸은 따로 스크롤 */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --ink: #161a22; --muted: #5d6573; --line: #dde1e8;
  --soft: #eef1f6; --accent: #2c5bd6; --accent-soft: #e6edfc;
  --good: #1f8a4c; --bad: #d2342b;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --surface: #1a1e26; --ink: #e8ebf0; --muted: #9aa3b2; --line: #2b313c;
    --soft: #222833; --accent: #7aa2ff; --accent-soft: #1f2a44; --good: #5fd08f; --bad: #ff6b5f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1e26; --ink: #e8ebf0; --muted: #9aa3b2; --line: #2b313c;
  --soft: #222833; --accent: #7aa2ff; --accent-soft: #1f2a44; --good: #5fd08f; --bad: #ff6b5f; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); line-height: 1.5; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.app {
  height: 100%; display: grid; grid-template-columns: 160px 230px 270px minmax(0, 1fr);
  padding-right: max(0px, env(safe-area-inset-right, 0px));
}
.app > * { min-height: 0; }
.col { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); background: var(--surface); }
.col-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
.col-head h2 { margin: 0; font-size: 0.95rem; font-weight: 700; }
.col-head .sub { font-size: 0.75rem; color: var(--muted); }
.scroll { overflow-y: auto; flex: 1; min-height: 0; }

/* 조건 */
.conds { padding: 14px; display: grid; gap: 16px; align-content: start; }
.field { display: grid; gap: 5px; }
.field > span { font-size: 0.82rem; font-weight: 600; }
.field > span small { display: block; font-weight: 400; font-size: 0.72rem; color: var(--muted); }
.field .row { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--muted); }
.field input {
  font: inherit; font-family: var(--font-num); width: 5.2em; padding: 5px 8px; border: 1px solid var(--line);
  border-radius: 7px; background: var(--bg); color: var(--ink); text-align: right; min-width: 0;
}
.field input.wide { width: 7.5em; }
.cond-foot { display: grid; gap: 8px; font-size: 0.72rem; color: var(--muted); padding: 0 14px 16px; }
.btn { font: inherit; font-size: 0.82rem; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 7px; padding: 6px 12px; cursor: pointer; justify-self: start; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* 종목 목록 */
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tab {
  flex: 1; font: inherit; font-size: 0.78rem; border: 0; background: transparent; color: var(--muted);
  padding: 10px 4px 8px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; display: grid; line-height: 1.25;
}
.tab b { font-family: var(--font-num); font-size: 0.95rem; color: inherit; }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.list { list-style: none; margin: 0; padding: 6px; display: grid; gap: 2px; }
.stock {
  width: 100%; font: inherit; text-align: left; border: 0; background: transparent; color: var(--ink);
  padding: 8px 10px; border-radius: 8px; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px;
}
.stock:hover { background: var(--soft); }
.stock[aria-selected="true"] { background: var(--accent-soft); }
.stock .tk { font-family: var(--font-num); font-weight: 600; }
.stock .nm { grid-column: 1 / -1; font-size: 0.74rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stock .g { font-family: var(--font-num); font-size: 0.78rem; align-self: center; }
.pos { color: var(--good); }
.neg { color: var(--bad); }
.dim { color: var(--muted); }
.empty { padding: 24px 14px; color: var(--muted); font-size: 0.85rem; }
.list-foot { padding: 8px 14px; border-top: 1px solid var(--line); font-size: 0.72rem; color: var(--muted); }

/* 오른쪽: 차트, 재무 (아직 비어 있음) */
.detail { display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); background: var(--bg); min-width: 0; }
.pane { display: flex; flex-direction: column; min-height: 0; border-bottom: 1px solid var(--line); }
.pane-head { display: flex; align-items: baseline; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--surface); }
.pane-head h3 { margin: 0; font-size: 0.92rem; }
.pane-head .who { font-size: 0.82rem; color: var(--muted); }
.pane-body { flex: 1; display: grid; place-items: center; color: var(--muted); font-size: 0.85rem; padding: 16px; text-align: center; }
@media (max-width: 900px) {
  html, body { height: auto; }
  .app { grid-template-columns: 1fr; height: auto; }
  .col { border-right: 0; border-bottom: 1px solid var(--line); }
  .scroll { max-height: 60vh; }
  .detail { grid-template-rows: 280px 280px; }
}
</style>

<div class="app">
  <!--__NAV__-->

  <aside class="col" aria-label="조건">
    <div class="col-head"><h2>조건</h2><div class="sub" id="meta"></div></div>
    <div class="scroll">
      <div class="conds">
        <label class="field"><span>최근 분기 EPS 증가율<small>(전년 동기 대비)</small></span>
          <span class="row"><input id="qG" type="number" step="1" inputmode="decimal">% 이상</span></label>
        <label class="field"><span>연간 EPS 3년 연평균 증가율<small>(복리)</small></span>
          <span class="row"><input id="yG" type="number" step="1" inputmode="decimal">% 이상</span></label>
        <label class="field"><span>ROE<small>(최근 4분기 TTM · 외국 기업은 최근 회계연도)</small></span>
          <span class="row"><input id="roe" type="number" step="1" inputmode="decimal">% 이상</span></label>
        <div class="field"><span>주가<small>(달러)</small></span>
          <span class="row"><input id="pLo" type="number" step="1" aria-label="최저가"> ~ <input id="pHi" type="number" step="1" aria-label="최고가"></span></div>
        <label class="field"><span>거래량<small>(50일 평균)</small></span>
          <span class="row"><input id="vol" class="wide" type="number" step="10000" inputmode="numeric">주 이상</span></label>
      </div>
      <div class="cond-foot">
        <button class="btn" id="reset" type="button">기본값으로</button>
        <span>주가 10달러 미만은 항상 제외</span>
        <span>EPS는 회계 기준(GAAP), 주식 분할 보정</span>
        <span>통과: 세 조건을 모두 숫자로 확인 · 흑자 전환: 1년 전 또는 3년 전 EPS가 적자라 계산 불가 · 비교 자료 없음: 상장 3년 미만, 외국 기업, 자료 누락</span>
        <span>데이터: 주가 Yahoo Finance · 실적 SEC EDGAR</span>
      </div>
    </div>
  </aside>

  <section class="col" aria-label="종목 목록">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" type="button" data-tab="num"></button>
      <button class="tab" role="tab" type="button" data-tab="turn"></button>
      <button class="tab" role="tab" type="button" data-tab="none"></button>
    </div>
    <div class="scroll"><ul class="list" id="list" role="listbox" aria-label="종목"></ul></div>
    <div class="list-foot">최근 분기 EPS 증가율 순 · ↑↓ 키로 이동</div>
  </section>

  <main class="detail">
    <section class="pane">
      <div class="pane-head"><h3>주봉 차트</h3><span class="who" id="who1"></span></div>
      <div class="pane-body">다음 단계에서 만들 자리예요</div>
    </section>
    <section class="pane">
      <div class="pane-head"><h3>재무 확인</h3><span class="who" id="who2"></span></div>
      <div class="pane-body">다음 단계에서 만들 자리예요</div>
    </section>
  </main>
</div>

<script>
const DATA = /*__DATA__*/null;
const DEF = { qG: 25, yG: 25, roe: 17, pLo: 15, pHi: 300, vol: 100000 };
const FLOOR = 10;
const TABS = { num: "통과", turn: "흑자 전환", none: "비교 자료 없음" };
let T = { ...DEF };
try {
  const s = JSON.parse(localStorage.getItem("screenerCond") || "null");
  if (s) for (const k of Object.keys(DEF)) if (typeof s[k] === "number") T[k] = s[k];
} catch (e) {}
let tab = "num", selected = null, current = [];

const pct = v => v == null ? "–" : (v > 0 ? "+" : "") + v.toFixed(1) + "%";

/* 한 조건의 결과: "num"(숫자로 통과) / "turn"(흑자 전환이라 계산 불가) / "none"(비교 자료 없음) / false(탈락) */
function growthTest(st, value, min) {
  if (st === "ok") return value >= min ? "num" : false;
  if (st === "loss") return false;
  return st === "turnaround" ? "turn" : "none";
}

/* 결과: false(탈락) 또는 탭 이름. 흑자 전환이 하나라도 있으면 "turn", 그다음 자료 없음이 있으면 "none" */
function judge(r) {
  const f = r.f;
  if (!f || (!f.quarters.length && !f.epsY)) return false;  // EPS가 아예 없는 종목(신탁, 펀드 등) 제외
  if (r.price < Math.max(FLOOR, T.pLo) || r.price > T.pHi || r.vol50 < T.vol) return false;
  const q = f.quarters.at(-1), y = f.epsY || {}, roe = f.roe && f.roe.roe;
  const res = [
    q ? growthTest(q.epsSt, q.epsG, T.qG) : "none",
    growthTest(y.st, y.cagr, T.yG),
    roe == null ? "none" : roe >= T.roe ? "num" : false,
  ];
  if (res.includes(false)) return false;
  return res.includes("turn") ? "turn" : res.includes("none") ? "none" : "num";
}

function qLabel(r) {
  const q = r.f.quarters.at(-1);
  if (!q || q.epsSt == null) return `<span class="g dim">–</span>`;
  if (q.epsSt === "turnaround") return `<span class="g pos">흑전</span>`;
  return `<span class="g ${q.epsG >= 0 ? "pos" : "neg"}">${pct(q.epsG)}</span>`;
}

function render() {
  const groups = { num: [], turn: [], none: [] };
  for (const r of DATA.rows) { const g = judge(r); if (g) groups[g].push(r); }
  for (const b of document.querySelectorAll(".tab")) {
    b.innerHTML = `${TABS[b.dataset.tab]}<b>${groups[b.dataset.tab].length}</b>`;
    b.setAttribute("aria-selected", String(b.dataset.tab === tab));
  }
  current = groups[tab].sort((a, b) => (b.f.quarters.at(-1)?.epsG ?? -1e9) - (a.f.quarters.at(-1)?.epsG ?? -1e9));
  const list = document.getElementById("list");
  list.innerHTML = current.length ? current.map(r => `<li><button type="button" class="stock" role="option" data-t="${r.t}"
      aria-selected="${r.t === selected}"><span class="tk">${r.t}</span>${qLabel(r)}<span class="nm">${r.name}</span></button></li>`).join("")
    : `<li class="empty">조건을 만족하는 종목이 없어요. 왼쪽 조건을 조금 완화해 보세요.</li>`;
  showSelected();
}

function select(t, focus) {
  selected = t;
  for (const b of document.querySelectorAll(".stock")) b.setAttribute("aria-selected", String(b.dataset.t === t));
  const btn = document.querySelector(`.stock[data-t="${CSS.escape(t)}"]`);
  if (btn) { btn.scrollIntoView({ block: "nearest" }); if (focus) btn.focus(); }
  showSelected();
}

function showSelected() {
  const r = DATA.rows.find(x => x.t === selected);
  const text = r ? `${r.t} · ${r.name}` : "왼쪽 목록에서 종목을 고르세요";
  document.getElementById("who1").textContent = text;
  document.getElementById("who2").textContent = text;
}

function save() { try { localStorage.setItem("screenerCond", JSON.stringify(T)); } catch (e) {} }
for (const k of Object.keys(DEF)) {
  const el = document.getElementById(k);
  el.value = T[k];
  el.addEventListener("input", () => {
    const v = Number(el.value);
    if (el.value === "" || Number.isNaN(v)) return;
    T[k] = v; save(); render();
  });
}
document.getElementById("reset").addEventListener("click", () => {
  T = { ...DEF }; save();
  for (const k of Object.keys(DEF)) document.getElementById(k).value = T[k];
  render();
});
for (const b of document.querySelectorAll(".tab")) b.addEventListener("click", () => { tab = b.dataset.tab; render(); });
const listEl = document.getElementById("list");
listEl.addEventListener("click", e => { const b = e.target.closest(".stock"); if (b) select(b.dataset.t); });
listEl.addEventListener("keydown", e => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  e.preventDefault();
  const i = current.findIndex(r => r.t === selected);
  const next = current[Math.min(current.length - 1, Math.max(0, i + (e.key === "ArrowDown" ? 1 : -1)))];
  if (next) select(next.t, true);
});

const gen = new Date(DATA.generatedAt).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", dateStyle: "medium", timeStyle: "short" });
document.getElementById("meta").innerHTML = `주가 기준일 <span class="num">${DATA.priceDate}</span><br>갱신 ${gen}`;
render();
</script>
